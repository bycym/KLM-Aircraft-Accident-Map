[tool.poetry]
name = "safety-database-service"
version = "0.1.0"
description = "Aircraft accident database worker"
authors = ["Áron Benkóczy"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
pydantic-settings = "^2.4.0"
pynamodb = "^6.0.0"
pika = "^1.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-mock = "^3.14.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
