name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      project_id:
        required: true
        type: string
      region:
        required: true
        default: us-central1
        type: string

permissions:
  contents: read
  id-token: write

env:
  GAR_LOCATION: ${{ inputs.region }}
  GAR_REPOSITORY: safety

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID
          service_account: deployer@${{ inputs.project_id }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push images
        run: |
          docker build -t $GAR_LOCATION-docker.pkg.dev/${{ inputs.project_id }}/$GAR_REPOSITORY/frontend:${{ github.sha }} frontend
          docker build -t $GAR_LOCATION-docker.pkg.dev/${{ inputs.project_id }}/$GAR_REPOSITORY/backend:${{ github.sha }} backend
          docker build -t $GAR_LOCATION-docker.pkg.dev/${{ inputs.project_id }}/$GAR_REPOSITORY/database-service:${{ github.sha }} database-service
          docker push $GAR_LOCATION-docker.pkg.dev/${{ inputs.project_id }}/$GAR_REPOSITORY/frontend:${{ github.sha }}
          docker push $GAR_LOCATION-docker.pkg.dev/${{ inputs.project_id }}/$GAR_REPOSITORY/backend:${{ github.sha }}
          docker push $GAR_LOCATION-docker.pkg.dev/${{ inputs.project_id }}/$GAR_REPOSITORY/database-service:${{ github.sha }}

      - name: Deploy backend
        run: |
          gcloud run deploy safety-backend \
            --image $GAR_LOCATION-docker.pkg.dev/${{ inputs.project_id }}/$GAR_REPOSITORY/backend:${{ github.sha }} \
            --region ${{ inputs.region }} \
            --allow-unauthenticated \
            --set-env-vars REDIS_URL=REDIS_URL_PLACEHOLDER,DATABASE_CLIENT=lambda,DATABASE_LAMBDA_FUNCTION_NAME=safety-database-service

      - name: Deploy frontend
        run: |
          gcloud run deploy safety-frontend \
            --image $GAR_LOCATION-docker.pkg.dev/${{ inputs.project_id }}/$GAR_REPOSITORY/frontend:${{ github.sha }} \
            --region ${{ inputs.region }} \
            --allow-unauthenticated
      
      - name: Deploy database-service
        run: |
          gcloud run deploy safety-database-service \
            --image $GAR_LOCATION-docker.pkg.dev/${{ inputs.project_id }}/$GAR_REPOSITORY/database-service:${{ github.sha }} \
            --region ${{ inputs.region }} \
            --allow-unauthenticated
