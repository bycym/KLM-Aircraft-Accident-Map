[tool.poetry]
name = "safety-backend"
version = "0.1.0"
description = "Aircraft accident map REST API"
authors = ["Áron Benkóczy"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
pydantic-settings = "^2.4.0"
redis = "^5.0.0"
pika = "^1.3.2"
boto3 = "^1.35.0"
mangum = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"
